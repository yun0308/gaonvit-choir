<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가온빛교회 시온찬양대</title>
<meta property="og:title" content="가온빛교회 시온찬양대">
<meta property="og:description" content="시온찬양대 악보 라이브러리">
<meta name="apple-mobile-web-app-title" content="가온빛교회 시온찬양대">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf8f4">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');

  :root{
    --bg: #faf8f4;
    --surface: #ffffff;
    --ink: #2b2a26;
    --ink-soft: #8c8678;
    --ink-faint: #b7b1a2;
    --line: #e9e3d6;
    --sage: #93a187;
    --clay-solid: #bb8a66;
    --slate: #8593a3;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }

  header{ padding:52px 24px 36px; max-width:640px; margin:0 auto; text-align:center; }
  header .crumb{ font-size:11px; font-weight:600; letter-spacing:0.42em; color:var(--ink-soft); margin-bottom:14px; }
  header h1{ font-family:'Cormorant Garamond',serif; font-weight:500; font-size:clamp(40px,8vw,60px); line-height:1.1; color:var(--ink); }
  header .sub{ margin-top:10px; font-size:12px; font-weight:500; letter-spacing:0.24em; color:var(--ink-faint); }

  .featured{ max-width:640px; margin:0 auto 28px; padding:0 24px; }
  .featured-inner{ border:1px solid var(--line); border-radius:2px; padding:22px 24px; text-align:center; cursor:pointer; transition:border-color 0.15s; }
  .featured-inner:hover{ border-color:var(--ink-faint); }
  .featured-label{ font-size:10.5px; font-weight:600; letter-spacing:0.3em; color:var(--clay-solid); margin-bottom:10px; }
  .featured-title{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:28px; color:var(--ink); }
  .featured-composer{ margin-top:6px; font-size:12.5px; color:var(--ink-soft); }

  .toolbar{ max-width:640px; margin:0 auto; padding:0 24px 10px; }
  .toolbar-inner{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .search-wrap{ flex:1 1 220px; position:relative; }
  .search-wrap input{ width:100%; font-family:inherit; font-size:15px; padding:13px 14px 13px 38px; border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); }
  .search-wrap input::placeholder{ color:var(--ink-faint); }
  .search-wrap input:focus{ outline:none; border-color:var(--ink); }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  select{ font-family:inherit; font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; padding:13px 4px; border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink-soft); cursor:pointer; }
  .count-badge{ font-size:11px; font-weight:500; letter-spacing:0.06em; color:var(--ink-faint); padding:0 4px; white-space:nowrap; }

  main{ max-width:640px; margin:0 auto; padding:4px 24px 60px; }
  .grid{ display:flex; flex-direction:column; }
  .piece{ background:transparent; border-bottom:1px solid var(--line); cursor:pointer; transition:opacity 0.14s; display:flex; align-items:center; gap:20px; padding:22px 4px; }
  .piece:hover{ opacity:0.62; }
  .piece .num{ flex:0 0 auto; width:38px; font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:500; color:var(--accent-row); text-align:center; }
  .piece .meta{ flex:1; min-width:0; }
  .piece h3{ font-weight:600; letter-spacing:-0.01em; font-size:16px; line-height:1.4; color:var(--ink); }
  .piece .composer{ font-size:12.5px; font-weight:400; color:var(--ink-soft); margin-top:3px; letter-spacing:0.01em; }
  .piece .yt{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; background:transparent; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); text-decoration:none; transition:color 0.14s; }
  .piece .yt:hover{ color:#c4302b; }

  .viewer-bg{ position:fixed; inset:0; background:rgba(20,18,15,0.94); display:none; flex-direction:column; z-index:60; }
  .viewer-bg.show{ display:flex; }
  .viewer-top{ display:flex; justify-content:space-between; align-items:center; padding:20px 24px; color:#faf8f4; }
  .viewer-top .title-block h3{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:21px; }
  .viewer-top .title-block p{ font-size:12px; color:rgba(250,248,244,0.55); margin-top:2px; }
  .viewer-top button{ background:transparent; border:1px solid rgba(250,248,244,0.3); color:#faf8f4; padding:8px 16px; border-radius:999px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:500; }
  .viewer-body{ flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:10px 20px 40px; }
  .viewer-body canvas{ max-width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.5); border-radius:4px; }
  .pdf-pages{ display:flex; flex-direction:column; gap:18px; align-items:center; }
  .loading-note{ text-align:center; padding:60px; color:rgba(250,248,244,0.5); }

  footer{ text-align:center; padding:36px 20px 20px; color:var(--ink-faint); font-size:11px; letter-spacing:0.08em; }
  footer a{ display:inline-block; margin-top:16px; padding:10px 24px; border:1px solid var(--line); border-radius:2px; font-size:12px; font-weight:600; letter-spacing:0.12em; color:var(--ink-soft); text-decoration:none; }
  footer a:hover{ border-color:var(--ink-faint); }

  @media(max-width:560px){
    .toolbar-inner{ flex-direction:column; align-items:stretch; }
    .toolbar-inner .search-wrap{ flex:0 0 auto; }
    .piece{ gap:14px; padding:18px 2px; }
    .piece .num{ width:30px; font-size:21px; }
    .piece h3{ font-size:15px; }
  }
</style>
</head>
<body>

<header>
  <div class="crumb">GAONVIT CHURCH</div>
  <h1>시온찬양대</h1>
  <div class="sub">SCORE LIBRARY</div>
</header>

<div id="featuredWrap"></div>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="제목 또는 작곡가로 찾기...">
    </div>
    <select id="sortSelect">
      <option value="default">기본순</option>
      <option value="title">제목순</option>
      <option value="composer">작곡가순</option>
    </select>
    <span class="count-badge" id="countBadge">0곡</span>
  </div>
</div>

<main>
  <div id="grid" class="grid"></div>
</main>

<footer>
  호흡이 있는 자마다 여호와를 찬양할지어다 · 시편 150:6
  <br>
  <a href="http://www.gaonvit.org/main/sub.html?pageCode=16" target="_blank" rel="noopener">주보 바로가기</a>
</footer>

<div class="viewer-bg" id="viewerBg">
  <div class="viewer-top">
    <div class="title-block">
      <h3 id="viewerTitle"></h3>
      <p id="viewerComposer"></p>
    </div>
    <button id="closeViewer">닫기 ✕</button>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pieces = [{"id": "p19", "title": "허락하신 새 땅에", "composer": "", "date": "26.10.04", "youtube": "https://youtu.be/VlOyWTo23UE", "file": "heorak.pdf"}, {"id": "p20", "title": "이 몸의 소망 무엔가", "composer": "William B. Bradbury 작곡 · Camp Kirkland 편곡", "date": "26.10.11", "youtube": "https://youtu.be/0o9rIg83_bA", "file": "imom.pdf"}, {"id": "p2", "title": "하늘 나라 가기 원하면", "composer": "Mary Kay Beall 작사 · Lloyd Larson 작곡", "date": "", "youtube": "https://youtu.be/2N1jNSwRu1g", "file": "hanul.pdf"}, {"id": "p6", "title": "다 함께 찬양해", "composer": "Dave and Jean Perry", "date": "", "youtube": "https://youtu.be/sgCDWHI_hPw", "file": "dahamkke.pdf"}, {"id": "p7", "title": "이 기쁜날", "composer": "조성철 작사 · 조대현 작곡", "date": "", "youtube": "https://youtu.be/mVdHnVjRkT0", "file": "igippeun.pdf"}, {"id": "p8", "title": "교회여 일어나라", "composer": "Arr. Joseph C.", "date": "", "youtube": "https://youtu.be/9GdAVHbgA7I", "file": "gyohoeyeo.pdf"}, {"id": "p9", "title": "내 주는 강한 성이요", "composer": "조라미 편곡", "date": "", "youtube": "https://youtu.be/lt5SiD1TNtQ", "file": "naejoo.pdf"}, {"id": "p11", "title": "새노래로 주를 찬양", "composer": "Jim Lucas", "date": "", "youtube": "https://youtu.be/u1RFvXl2OEM", "file": "saenorae.pdf"}, {"id": "p1", "title": "주께 감사하라", "composer": "Lloyd Larson", "date": "26.07.05", "youtube": "https://youtu.be/ryvRNYjK9Wo", "file": "juge.pdf"}, {"id": "p12", "title": "주가 나를 승리케 하심", "composer": "W.Fimo Mercer · 편곡 정용하", "date": "26.07.12", "youtube": "https://youtu.be/kAt1dufFpiU", "file": "seunglee.pdf"}, {"id": "p13", "title": "전능하신 하나님", "composer": "백승남 작사·곡", "date": "26.07.19", "youtube": "https://youtu.be/R7iErIvTAvo", "file": "jeonneung.pdf"}, {"id": "p4", "title": "주의 교회", "composer": "Stan Pethel 작곡 · 권혜란 역", "date": "26.07.26", "youtube": "https://youtu.be/wm0X9osTKkM", "file": "juuie.pdf"}, {"id": "p5", "title": "이 날은 주께서 정하신 날", "composer": "John Carter", "date": "26.08.02", "youtube": "https://youtu.be/RvxcctJM_2E", "file": "idal.pdf"}, {"id": "p3", "title": "믿는 사람들은 군병같으니", "composer": "이현철 편곡", "date": "26.08.09", "youtube": "https://youtu.be/xDfbkfomWsI", "file": "midneun.pdf"}, {"id": "p14", "title": "주 예수 이름 높이어", "composer": "Oliver Holden 작곡 · Camp Kirkland 편곡", "date": "26.08.16", "youtube": "https://youtu.be/0Pg3lH-eKU4", "file": "jooyesu.pdf"}, {"id": "p10", "title": "하나님께 찬양드리세", "composer": "Edwin Willmington", "date": "26.08.30", "youtube": "https://youtu.be/FgYVous8G9g", "file": "hananim.pdf"}, {"id": "p15", "title": "찬양하라 복되신 구세주", "composer": "C. G. Allen", "date": "26.09.06", "youtube": "https://youtu.be/GrY08DGt24A", "file": "chanyanghara.pdf"}, {"id": "p16", "title": "전능하신 창조의 주", "composer": "Gesangbuch der Herzogl 원곡 · Camp Kirkland 편곡", "date": "26.09.13", "youtube": "https://youtu.be/dgc_CHLzKNc", "file": "jeonneunghasin_changjo.pdf"}, {"id": "p17", "title": "내게 강 같은 평화", "composer": "Traditional Spiritual · Joel Raney 편곡", "date": "26.09.20", "youtube": "https://youtu.be/raLfJg52gBc", "file": ""}, {"id": "p18", "title": "주 예수 이름 높이어", "composer": "Oliver Holden 작곡 · Camp Kirkland 편곡", "date": "26.09.27", "youtube": "https://youtu.be/0Pg3lH-eKU4", "file": "jooyesu.pdf"}];
const FEATURED_ID = "p19";
const GRAY_IDS = ["p1", "p12", "p13", "p4", "p5", "p3", "p14", "p10", "p15", "p16", "p17", "p18"];
const BASE_URL = './scores/';

const grid = document.getElementById('grid');
const countBadge = document.getElementById('countBadge');
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderFeatured(){
  const wrap = document.getElementById('featuredWrap');
  const p = pieces.find(x=>x.id===FEATURED_ID);
  if(!p){ wrap.innerHTML=''; return; }
  wrap.innerHTML=`<div class="featured"><div class="featured-inner"><div class="featured-label">THIS WEEK · ${escapeHtml(p.date||'')}</div><div class="featured-title">${escapeHtml(p.title)}</div><div class="featured-composer">${escapeHtml(p.composer||'')}</div></div></div>`;
  wrap.querySelector('.featured-inner').addEventListener('click',()=>openViewer(p));
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  let list = pieces.filter(p=>!q||p.title.toLowerCase().includes(q)||(p.composer||'').toLowerCase().includes(q));
  const sort = sortSelect.value;
  if(sort==='title') list.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  else if(sort==='composer') list.sort((a,b)=>(a.composer||'').localeCompare(b.composer||'','ko'));

  countBadge.textContent = pieces.length+'곡';
  grid.innerHTML='';

  const rowColors=['var(--sage)','var(--clay-solid)','var(--slate)'];
  list.forEach((p,idx)=>{
    const isGray = GRAY_IDS.includes(p.id);
    const card = document.createElement('div');
    card.className='piece';
    if(isGray) card.style.opacity='0.45';
    card.style.setProperty('--accent-row', isGray?'var(--ink-faint)':rowColors[idx%rowColors.length]);
    card.innerHTML=`
      <div class="num">${String(idx+1).padStart(2,'0')}</div>
      <div class="meta">
        <h3>${escapeHtml(p.title)}</h3>
        <div class="composer">${escapeHtml(p.composer||'')}${p.date?` <span style="font-style:normal;font-size:11px;color:var(--ink-faint);margin-left:6px;">${escapeHtml(p.date)}</span>`:''}</div>
      </div>
      ${p.youtube?`<a class="yt" href="${escapeHtml(p.youtube)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg></a>`:''}
    `;
    card.addEventListener('click',()=>openViewer(p));
    grid.appendChild(card);
  });
}

searchInput.addEventListener('input',render);
sortSelect.addEventListener('change',render);

const viewerBg=document.getElementById('viewerBg');
const viewerBody=document.getElementById('viewerBody');
const viewerTitle=document.getElementById('viewerTitle');
const viewerComposer=document.getElementById('viewerComposer');
document.getElementById('closeViewer').addEventListener('click',()=>viewerBg.classList.remove('show'));
viewerBg.addEventListener('click',e=>{if(e.target===viewerBg)viewerBg.classList.remove('show');});

async function openViewer(p){
  viewerTitle.textContent=p.title;
  viewerComposer.textContent=p.composer||'';
  viewerBody.innerHTML='<div class="loading-note">불러오는 중...</div>';
  viewerBg.classList.add('show');
  try{
    const pdf=await pdfjsLib.getDocument(BASE_URL+p.file).promise;
    const container=document.createElement('div');
    container.className='pdf-pages';
    viewerBody.innerHTML='';
    viewerBody.appendChild(container);
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n);
      const vp=page.getViewport({scale:1.6});
      const canvas=document.createElement('canvas');
      canvas.width=vp.width; canvas.height=vp.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      container.appendChild(canvas);
    }
  }catch(e){
    viewerBody.innerHTML='<div class="loading-note">악보를 불러오지 못했습니다.</div>';
  }
}

renderFeatured();
render();
</script>
</body>
</html>
